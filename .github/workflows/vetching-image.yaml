# Builds the Teleport server image for the vetching bastion: the official distroless debug image with the teleport binary replaced by this fork's build (OSS OIDC connector).
# The repository only allows local actions, so every step is a plain shell command.
name: vetching-image

on:
  push:
    branches:
      - feat/console-oidc-login-18.11
    paths:
      - .github/workflows/vetching-image.yaml
      - lib/**
      - tool/**
  workflow_dispatch:
    inputs:
      base_image_version:
        description: Official teleport-distroless-debug tag that provides tctl, tsh, tbot and the runtime layout
        required: true
        default: 18.11.3

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: public.ecr.aws/gravitational/teleport-distroless-debug:${{ inputs.base_image_version || '18.11.3' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/teleport-oidc
  GO_VERSION: 1.25.14
  NODE_VERSION: 24.19.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Check out this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install Go and Node
        run: |
          mkdir -p "${RUNNER_TEMP}/tools"
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${{ matrix.arch }}.tar.gz" | tar -xz -C "${RUNNER_TEMP}/tools"
          node_arch="${{ matrix.arch }}"; [ "$node_arch" = amd64 ] && node_arch=x64
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${node_arch}.tar.xz" | tar -xJ -C "${RUNNER_TEMP}/tools"
          echo "${RUNNER_TEMP}/tools/go/bin" >> "$GITHUB_PATH"
          echo "${RUNNER_TEMP}/tools/node-v${NODE_VERSION}-linux-${node_arch}/bin" >> "$GITHUB_PATH"

      - name: Install wasm toolchain for the web UI
        run: |
          go version
          node --version
          corepack enable pnpm
          rustup target add wasm32-unknown-unknown
          make ensure-wasm-bindgen ensure-wasm-opt

      - name: Build web assets
        run: make ensure-webassets

      - name: Build teleport with embedded web assets
        env:
          CGO_ENABLED: "1"
        run: go build -tags webassets_embed -trimpath -o build/teleport ./tool/teleport

      - name: Check binary
        run: build/teleport version

      - name: Build and push the per-architecture image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          cat > build/Dockerfile <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          COPY teleport /usr/local/bin/teleport
          EOF
          tag="${GITHUB_SHA::12}-${{ matrix.arch }}"
          docker build --platform "linux/${{ matrix.arch }}" --provenance=false --build-arg BASE_IMAGE="${BASE_IMAGE}" -t "${IMAGE}:${tag}" build
          docker push "${IMAGE}:${tag}"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the multi-architecture tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          sha="${GITHUB_SHA::12}"
          docker buildx imagetools create -t "${IMAGE}:${sha}" "${IMAGE}:${sha}-arm64" "${IMAGE}:${sha}-amd64"
          docker buildx imagetools inspect "${IMAGE}:${sha}"
          echo "image: ${IMAGE}:${sha}" >> "$GITHUB_STEP_SUMMARY"
